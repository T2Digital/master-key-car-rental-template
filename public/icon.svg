<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="96" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4" />
  
  <!-- Subtle inner ambient glow -->
  <circle cx="256" cy="220" r="170" fill="url(#accentGlow)" />

  <!-- Main Symbol: Master Key + Luxury Crest -->
  <g filter="url(#shadow)" transform="translate(0, -10)">
    <!-- Shield / Crest Outline -->
    <path d="M 256 90 L 360 140 C 360 250 256 320 256 340 C 256 320 152 250 152 140 Z" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="10" 
          stroke-linejoin="round" />
    
    <!-- Central Golden Key -->
    <!-- Key Bow / Ring -->
    <circle cx="256" cy="170" r="42" fill="none" stroke="url(#goldGrad)" stroke-width="14" />
    <circle cx="256" cy="170" r="18" fill="url(#goldGrad)" />
    
    <!-- Key Shaft -->
    <rect x="250" y="212" width="12" height="90" rx="6" fill="url(#goldGrad)" />
    
    <!-- Key Bits -->
    <path d="M 262 255 L 285 255 L 285 270 L 262 270 Z" fill="url(#goldGrad)" />
    <path d="M 262 280 L 280 280 L 280 295 L 262 295 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Brand Typography -->
  <text x="256" y="415" 
        text-anchor="middle" 
        font-family="'Cairo', 'Tajawal', sans-serif" 
        font-size="34" 
        font-weight="900" 
        letter-spacing="4" 
        fill="url(#goldGrad)">
    MASTER KEY
  </text>

  <text x="256" y="455" 
        text-anchor="middle" 
        font-family="'Cairo', 'Tajawal', sans-serif" 
        font-size="20" 
        font-weight="700" 
        letter-spacing="6" 
        fill="#94a3b8">
    K R M  RENTAL
  </text>
</svg>
